  <path d="M216,66 C214,75 224,80 230,74 C234,70 232,62 226,62" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
  <path d="M218,60 C210,56 206,64 208,72 C202,72 204,80 212,80" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
